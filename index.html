<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Coach Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #status-bar { 
            background: #1e1e1e; padding: 25px; border-radius: 20px; border: 1px solid #333; 
            width: 100%; max-width: 500px; text-align: center; margin-bottom: 20px;
            position: sticky; top: 10px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #timer { font-size: 4.5rem; font-weight: bold; font-family: monospace; color: #2ecc71; margin: 10px 0; }
        #current-mode { font-size: 1.5rem; font-weight: bold; text-transform: uppercase; color: #1DB954; }
        .lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 600px; }
        .lesson-card { background: #181818; border: 1px solid #333; padding: 15px; border-radius: 12px; text-align: center; }
        .start-btn { width: 100%; padding: 12px; background: #2ecc71; border: none; color: black; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .start-btn:active { background: #27ae60; transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>🏃‍♂️ Run Coach Pro</h1>

    <!-- Status bar is nu direct zichtbaar -->
    <div id="status-bar">
        <div id="current-mode">Kies een les</div>
        <div id="timer">00:00</div>
        <div id="track-info" style="font-size: 0.8rem; color: #888; margin-top: 10px;">Audio staat klaar</div>
    </div>

    <!-- De lessen zijn nu direct zichtbaar -->
    <div class="lesson-grid" id="lessonGrid"></div>

    <script>
        const audio = new Audio();
        let timerInterval = null;

        // VERVANG DEZE LINKS door echte .mp3 links voor geluid!
        const songs = {
            w: "https://soundhelix.com",
            l: "https://soundhelix.com"
        };

        function spreekUit(tekst) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(tekst);
            msg.lang = 'nl-NL';
            msg.rate = 0.9;
            window.speechSynthesis.speak(msg);
        }

        // Lessen bouwen
        const grid = document.getElementById('lessonGrid');
        for (let i = 1; i <= 30; i++) {
            const schema = (i % 2 === 0) ? "2l-1w-2l" : "1l-1w-1l";
            const card = document.createElement('div');
            card.className = 'lesson-card';
            card.innerHTML = `<strong>Les ${i}</strong><br><button class="start-btn" style="margin-top:10px">START</button>`;
            
            // De audio wordt nu geactiveerd ZODRA je op een les klikt
            card.querySelector('button').addEventListener('click', () => {
                // Korte "silent" play om audio context te activeren voor mobiel
                audio.play().then(() => audio.pause()).catch(e => console.log("Audio kickstart"));
                runLes(schema, i);
            });
            grid.appendChild(card);
        }

        async function runLes(schema, lesNummer) {
            if (timerInterval) clearInterval(timerInterval);
            const segs = schema.split('-');
            
            spreekUit(`Les ${lesNummer} gestart. Veel succes!`);
            
            for (let s of segs) {
                let tijd = parseInt(s) * 60;
                let type = s.slice(-1);
                
                document.getElementById('current-mode').innerText = type === 'w' ? "WANDELEN" : "HARDLOPEN";
                document.getElementById('current-mode').style.color = type === 'w' ? "#3498db" : "#e74c3c";
                
                audio.src = songs[type];
                audio.loop = true;
                audio.play().catch(e => console.log("Speel af fout:", e));
                
                spreekUit(`Nu ${parseInt(s)} minuten ${type === 'w' ? 'wandelen' : 'hardlopen'}`);

                await new Promise(res => {
                    timerInterval = setInterval(() => {
                        let m = Math.floor(tijd / 60), sec = tijd % 60;
                        document.getElementById('timer').innerText = `${m}:${sec < 10 ? '0'+sec : sec}`;
                        if (tijd-- <= 0) { clearInterval(timerInterval); res(); }
                    }, 1000);
                });
            }
            audio.pause();
            document.getElementById('current-mode').innerText = "KLAAR!";
            spreekUit("Gefeliciteerd, de training is voltooid!");
        }
    </script>
</body>
</html>
