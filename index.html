<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Coach Pro</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        /* Stijl voor de laatste wijziging tekst */
        #last-modified { font-size: 0.75rem; color: #555; margin-bottom: 10px; }
        #status-bar { background: #1e1e1e; padding: 20px; border-radius: 20px; border: 1px solid #333; width: 100%; max-width: 500px; text-align: center; margin-bottom: 20px; position: sticky; top: 10px; z-index: 100; }
        #timer { font-size: 4rem; font-weight: bold; font-family: monospace; color: #2ecc71; margin: 5px 0; }
        #current-mode { font-size: 1.2rem; font-weight: bold; text-transform: uppercase; color: #1DB954; }
        .setup-section { background: #181818; padding: 15px; border-radius: 12px; margin-bottom: 20px; width: 100%; max-width: 500px; border: 1px dashed #444; }
        .lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; width: 100%; max-width: 650px; }
        .lesson-card { background: #181818; border: 1px solid #333; padding: 15px; border-radius: 12px; text-align: center; }
        .lesson-card.completed { border-color: #2ecc71; background: #0f1a12; }
        .start-btn { width: 100%; padding: 10px; background: #2ecc71; border: none; color: black; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- Automatische datum van wijziging -->
    <div id="last-modified">Laatst gewijzigd: <span id="mod-date"></span></div>

    <h1>🏃‍♂️ Run Coach Pro</h1>

    <div id="status-bar">
        <div id="current-mode">Klaar?</div>
        <div id="timer">00:00</div>
    </div>

    <div class="setup-section">
        <strong>Eigen muziek toevoegen (optioneel)</strong>
        <div style="font-size: 0.8rem; margin: 10px 0; text-align: left;">
            Wandelen: <input type="file" id="upload-w" accept="audio/*" multiple><br><br>
            Hardlopen: <input type="file" id="upload-l" accept="audio/*" multiple>
        </div>
        <button id="reset-btn" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">WIS VOORTGANG</button>
    </div>

    <div class="lesson-grid" id="lessonGrid"></div>

    <script>
        // Functie om de wijzigingsdatum van het bestand te tonen
        function showLastModified() {
            const modDate = document.lastModified;
            document.getElementById('mod-date').innerText = modDate;
        }

        const audio = new Audio();
        let timerInterval = null;
        let currentType = '';

        let playlists = { 
            w: ["https://soundhelix.com"], 
            l: ["https://soundhelix.com"] 
        };

        audio.onended = () => { if(currentType) speelMuziek(currentType); };

        document.getElementById('upload-w').onchange = (e) => playlists.w = Array.from(e.target.files).map(f => URL.createObjectURL(f));
        document.getElementById('upload-l').onchange = (e) => playlists.l = Array.from(e.target.files).map(f => URL.createObjectURL(f));

        function speelMuziek(type) {
            currentType = type;
            const list = playlists[type];
            if(list && list.length > 0) {
                audio.src = list[Math.floor(Math.random() * list.length)];
                audio.play().catch(e => console.log("Klik eerst op de pagina"));
            }
        }

        function spreekUit(tekst) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(tekst);
            msg.lang = 'nl-NL';
            window.speechSynthesis.speak(msg);
        }

        function buildGrid() {
            const grid = document.getElementById('lessonGrid');
            grid.innerHTML = ''; 
            for (let i = 1; i <= 30; i++) {
                const savedData = JSON.parse(localStorage.getItem(`les-data-${i}`)) || { done: false, date: '' };
                const schema = (i % 2 === 0) ? "2l-1w-2l" : "1l-1w-1l";
                const card = document.createElement('div');
                card.className = `lesson-card ${savedData.done ? 'completed' : ''}`;
                card.innerHTML = `<strong>Les ${i}</strong><button class="start-btn">START</button><br><br><label style="font-size:0.7rem"><input type="checkbox" ${savedData.done ? 'checked' : ''}> Klaar</label><div style="font-size:0.6rem; color:#888;">${savedData.date}</div>`;
                
                card.querySelector('input').onchange = (e) => {
                    const d = e.target.checked ? new Date().toLocaleString('nl-NL') : '';
                    localStorage.setItem(`les-data-${i}`, JSON.stringify({ done: e.target.checked, date: d }));
                    buildGrid();
                };
                card.querySelector('.start-btn').onclick = () => runLes(schema, i);
                grid.appendChild(card);
            }
        }

        async function runLes(schema, nr) {
            if (timerInterval) clearInterval(timerInterval);
            spreekUit(`Les ${nr} gestart.`);
            const segs = schema.split('-');
            for (let s of segs) {
                let tijd = parseInt(s) * 60;
                let type = s.slice(-1);
                document.getElementById('current-mode').innerText = type === 'w' ? "WANDELEN" : "HARDLOPEN";
                speelMuziek(type);
                spreekUit(`Nu ${parseInt(s)} minuten ${type === 'w' ? 'wandelen' : 'hardlopen'}`);
                await new Promise(res => {
                    timerInterval = setInterval(() => {
                        let m = Math.floor(tijd / 60), sec = tijd % 60;
                        document.getElementById('timer').innerText = `${m}:${sec < 10 ? '0'+sec : sec}`;
                        if (tijd-- <= 0) { clearInterval(timerInterval); res(); }
                    }, 1000);
                });
            }
            audio.pause();
            spreekUit("Klaar!");
            localStorage.setItem(`les-data-${nr}`, JSON.stringify({ done: true, date: new Date().toLocaleString('nl-NL') }));
            buildGrid();
        }

        document.getElementById('reset-btn').onclick = () => { if(confirm("Alles wissen?")) { localStorage.clear(); buildGrid(); } };
        
        // Startfuncties bij laden
        showLastModified();
        buildGrid();
    </script>
</body>
</html>
