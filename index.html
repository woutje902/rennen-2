<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run-Walk Tracker</title>
</head>
<body>
    <h1>Interval Tracker</h1>
    
    <button id="startBtn">Start Training</button>
    <p id="status">Status: Wachten op start...</p>
    <p id="gps-data">Locatie: Onbekend</p>

    <audio id="audioPlayer" preload="auto">
        <source src="jouw-muziek.mp3" type="audio/mpeg">
    </audio>

    <script>
        const startBtn = document.getElementById('startBtn');
        const audio = document.getElementById('audioPlayer');
        const statusText = document.getElementById('status');
        const gpsText = document.getElementById('gps-data');

        // 1. Oplossing voor knoppen en audio op mobiel
        startBtn.addEventListener('click', function() {
            // Audio moet geïnitialiseerd worden via een gebruikersklik
            audio.play().then(() => {
                statusText.innerText = "Status: Muziek speelt en tracker gestart!";
            }).catch(error => {
                console.error("Audio fout:", error);
                statusText.innerText = "Status: Klik opnieuw om audio te activeren.";
            });

            // 2. Oplossing voor GPS
            startGpsTracking();
        });

        function startGpsTracking() {
            if ("geolocation" in navigator) {
                // watchPosition is beter voor hardlopen dan getCurrentPosition
                navigator.geolocation.watchPosition(
                    (position) => {
                        const lat = position.coords.latitude.toFixed(5);
                        const lon = position.coords.longitude.toFixed(5);
                        gpsText.innerText = `Locatie: ${lat}, ${lon}`;
                    },
                    (error) => {
                        gpsText.innerText = `GPS Fout: ${error.message}`;
                        console.error(error);
                    },
                    { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
                );
            } else {
                gpsText.innerText = "GPS wordt niet ondersteund door deze browser.";
            }
        }
    </script>
</body>
</html>
