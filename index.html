<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run-Walk Tracker</title>
</head>
<body>
    <div style="font-size: 0.8em; color: gray;">Laatst aangepast: 07-05-2024</div>
    <h1>Interval Tracker</h1>
    
    <button id="startBtn" style="padding: 20px; font-size: 20px;">START TRAINING</button>
    
    <p id="status">Status: Klik op start</p>
    <p id="gps-data">Locatie: Zoeken...</p>

    <audio id="audioPlayer">
        <source src="muziek.mp3" type="audio/mpeg">
    </audio>

    <script>
        const startBtn = document.getElementById('startBtn');
        const audio = document.getElementById('audioPlayer');
        const statusText = document.getElementById('status');
        const gpsText = document.getElementById('gps-data');

        startBtn.onclick = function() {
            // Audio direct starten
            audio.play();
            statusText.innerText = "Status: Programma loopt";

            // GPS starten
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(function(position) {
                    gpsText.innerText = "Locatie: " + position.coords.latitude.toFixed(4) + ", " + position.coords.longitude.toFixed(4);
                }, function(error) {
                    gpsText.innerText = "GPS Fout: " + error.message;
                }, { enableHighAccuracy: true });
            } else {
                gpsText.innerText = "Geen GPS beschikbaar";
            }
        };
    </script>
</body>
</html>
