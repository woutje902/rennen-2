<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Coach Pro - Evy Gruyaert Edition</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #status-bar { background: #1e1e1e; padding: 20px; border-radius: 20px; border: 2px solid #2ecc71; width: 100%; max-width: 500px; text-align: center; margin-bottom: 20px; position: sticky; top: 10px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #timer { font-size: 4.5rem; font-weight: bold; font-family: monospace; color: #2ecc71; margin: 5px 0; }
        #current-mode { font-size: 1.5rem; font-weight: bold; text-transform: uppercase; color: #1DB954; }
        #now-playing { font-size: 0.75rem; color: #888; margin-top: 10px; font-style: italic; border-top: 1px solid #333; padding-top: 5px; }
        .lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 650px; }
        .lesson-card { background: #181818; border: 1px solid #333; padding: 15px; border-radius: 12px; text-align: center; }
        .lesson-card.completed { border-color: #2ecc71; background: #0f1a12; }
        .start-btn { width: 100%; padding: 12px; background: #2ecc71; border: none; color: black; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .start-btn:active { transform: scale(0.95); background: #27ae60; }
        .setup-section { background: #181818; padding: 15px; border-radius: 12px; margin-bottom: 20px; width: 100%; max-width: 500px; border: 1px dashed #444; text-align: center; }
        input[type="file"] { font-size: 0.7rem; margin: 5px 0; }
    </style>
</head>
<body>

    <h1>🏃‍♂️ Run Coach Pro</h1>
    <div id="status-bar">
        <div id="current-mode">Kies een les</div>
        <div id="timer">00:00</div>
        <div id="now-playing">Muziek: Stand-by</div>
    </div>

    <div class="setup-section">
        <strong>Audio Bronnen</strong><br>
        <small style="color:#888">Standaard muziek is actief, of upload eigen MP3's:</small><br><br>
        <div style="text-align: left; display: inline-block;">
            Wandelen: <input type="file" id="upload-w" accept="audio/*" multiple><br>
            Lopen: <input type="file" id="upload-l" accept="audio/*" multiple>
        </div><br><br>
        <button id="reset-btn" style="background:#e74c3c; color:white; border:none; padding:8px 15px; border-radius:5px; cursor:pointer; font-weight:bold;">WIS VOORTGANG</button>
    </div>

    <div class="lesson-grid" id="lessonGrid"></div>

    <script>
        const audio = new Audio();
        let timerInterval = null;
        let currentType = '';

        // STANDAARD MUZIEK (SOUNDHELIX)
        const defaultPlaylists = { 
            w: ["https://soundhelix.com"], 
            l: [
                "https://soundhelix.com",
                "https://soundhelix.com"
            ] 
        };

        let activePlaylists = { ...defaultPlaylists };

        const evySchema = {
            1: "1l-1w-1l-1w-2l-2w-2l-2w-3l-3w", 2: "1l-1w-1l-1w-2l-2w-3l-3w-3l-3w", 3: "1l-1w-2l-2w-2l-2w-3l-3w-3l-3w",
            4: "1l-1w-2l-2w-2l-2w-3l-3w-3l-3w", 5: "2l-2w-3l-2w-3l-2w-3l-2w-3l-2w", 6: "2l-2w-3l-2w-4l-3w-4l-3w",
            7: "3l-2w-3l-2w-3l-2w-4l-2w-4l-2w", 8: "3l-2w-3l-2w-4l-2w-4l-2w-5l-3w", 9: "3l-2w-4l-2w-4l-2w-5l-2w-5l-3w",
            10: "3l-2w-4l-2w-4l-2w-5l-2w-5l-3w", 11: "4l-2w-4l-2w-5l-2w-5l-2w-5l-3w", 12: "4l-2w-5l-2w-5l-2w-7l-3w",
            13: "5l-2w-5l-2w-7l-2w-7l-3w", 14: "5l-2w-7l-2w-7l-2w-8l-3w", 15: "7l-2w-8l-2w-10l-3w",
            16: "7l-2w-8l-2w-10l-3w", 17: "8l-2w-10l-2w-12l-3w", 18: "10l-2w-12l-2w-10l-3w",
            19: "10l-2w-12l-2w-10l-3w", 20: "12l-2w-12l-2w-10l-3w", 21: "15l-3w-15l-3w",
            22: "15l-3w-15l-3w", 23: "10l-2w-12l-2w-12l-3w", 24: "10l-2w-20l-3w",
            25: "10l-2w-20l-3w", 26: "15l-2w-15l-3w", 27: "20l-2w-10l-3w",
            28: "25l-3w", 29: "28l-2w", 30: "30l"
        };

        function speelMuziek(type) {
            currentType = type;
            const list = activePlaylists[type];
            if(list && list.length > 0) {
                const track = list[Math.floor(Math.random() * list.length)];
                audio.src = track;
                // Visuele update
                const trackName = track.includes('blob:') ? "Eigen bestand" : track.split('/').pop();
                document.getElementById('now-playing').innerText = "🎵 Nu speelt: " + trackName;
                audio.play().catch(e => console.log("Audio start pas na interactie"));
            }
        }

        function spreekUit(tekst) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(tekst);
            msg.lang = 'nl-NL';
            window.speechSynthesis.speak(msg);
        }

        function buildGrid() {
            const grid = document.getElementById('lessonGrid');
            grid.innerHTML = ''; 
            for (let i = 1; i <= 30; i++) {
                const savedData = JSON.parse(localStorage.getItem(`evy-les-${i}`)) || { done: false, date: '' };
                const card = document.createElement('div');
                card.className = `lesson-card ${savedData.done ? 'completed' : ''}`;
                card.innerHTML = `
                    <strong>Les ${i}</strong><br>
                    <button class="start-btn" data-les="${i}">START LES</button><br><br>
                    <input type="checkbox" class="done-check" data-les="${i}" ${savedData.done ? 'checked' : ''}> Klaar
                    <div style="font-size:0.6rem; color:#888; margin-top:5px;">${savedData.date}</div>
                `;
                grid.appendChild(card);
            }
        }

        document.getElementById('lessonGrid').addEventListener('click', (e) => {
            const lesNr = e.target.getAttribute('data-les');
            if (!lesNr) return;
            if (e.target.classList.contains('start-btn')) runLes(evySchema[lesNr], lesNr);
            if (e.target.classList.contains('done-check')) {
                const d = e.target.checked ? new Date().toLocaleDateString('nl-NL') : '';
                localStorage.setItem(`evy-les-${lesNr}`, JSON.stringify({ done: e.target.checked, date: d }));
                buildGrid();
            }
        });

        async function runLes(schema, nr) {
            if (timerInterval) clearInterval(timerInterval);
            spreekUit(`Les ${nr} gestart.`);
            const segs = schema.match(/(\d+[wl])/g);
            for (let s of segs) {
                let tijd = parseInt(s) * 60;
                let type = s.slice(-1);
                document.getElementById('current-mode').innerText = type === 'w' ? "WANDELEN" : "HARDLOPEN";
                document.getElementById('current-mode').style.color = type === 'w' ? "#3498db" : "#2ecc71";
                
                speelMuziek(type);
                spreekUit(`Nu ${parseInt(s)} minuten ${type === 'w' ? 'wandelen' : 'hardlopen'}`);
                
                await new Promise(res => {
                    timerInterval = setInterval(() => {
                        let m = Math.floor(tijd / 60), sec = tijd % 60;
                        document.getElementById('timer').innerText = `${m}:${sec < 10 ? '0'+sec : sec}`;
                        if (tijd-- <= 0) { clearInterval(timerInterval); res(); }
                    }, 1000);
                });
            }
            audio.pause();
            document.getElementById('now-playing').innerText = "Les voltooid!";
            spreekUit("Geweldig gewerkt! De les is klaar.");
            localStorage.setItem(`evy-les-${nr}`, JSON.stringify({ done: true, date: new Date().toLocaleDateString('nl-NL') }));
            buildGrid();
        }

        document.getElementById('reset-btn').onclick = () => { if(confirm("Voortgang wissen?")) { localStorage.clear(); buildGrid(); } };
        document.getElementById('upload-w').onchange = (e) => activePlaylists.w = Array.from(e.target.files).map(f => URL.createObjectURL(f));
        document.getElementById('upload-l').onchange = (e) => activePlaylists.l = Array.from(e.target.files).map(f => URL.createObjectURL(f));
        
        buildGrid();
    </script>
</body>
</html>
