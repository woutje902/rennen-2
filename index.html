<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run Coach Pro - GitHub Fix</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #121212; color: white; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        #unlock-btn { background: #ff5500; color: white; border: none; padding: 20px 40px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.2rem; margin-bottom: 20px; }
        #status-bar { background: #1e1e1e; padding: 25px; border-radius: 20px; border: 1px solid #333; width: 100%; max-width: 500px; text-align: center; display: none; }
        #timer { font-size: 4.5rem; font-weight: bold; font-family: monospace; color: #2ecc71; margin: 10px 0; }
        #current-mode { font-size: 1.5rem; font-weight: bold; text-transform: uppercase; color: #1DB954; }
        .lesson-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; width: 100%; max-width: 600px; margin-top: 30px; display: none; }
        .lesson-card { background: #181818; border: 1px solid #333; padding: 15px; border-radius: 12px; text-align: center; }
        .start-btn { width: 100%; padding: 12px; background: #2ecc71; border: none; color: black; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>🏃‍♂️ Run Coach Pro</h1>

    <button id="unlock-btn">STAP 1: ACTIVEER COACH</button>

    <div id="status-bar">
        <div id="current-mode">Kies een les</div>
        <div id="timer">00:00</div>
        <div id="track-info" style="font-size: 0.8rem; color: #888; margin-top: 10px;">Muziek klaar</div>
    </div>

    <div class="lesson-grid" id="lessonGrid"></div>

    <script>
        const audio = new Audio();
        let timerInterval = null;

        const songs = {
            w: "https://pixabay.com",
            l: "https://pixabay.com"
        };

        // De enige manier om audio te "unmuten" op iPhone/Android via GitHub
        document.getElementById('unlock-btn').addEventListener('click', function() {
            audio.src = songs.w;
            audio.play().then(() => {
                audio.pause();
                document.getElementById('unlock-btn').style.display = 'none';
                document.getElementById('status-bar').style.display = 'block';
                document.getElementById('lessonGrid').style.display = 'grid';
                spreekUit("Systeem klaar. Succes!");
            }).catch(e => alert("Klik nogmaals op de knop."));
        });

        function spreekUit(tekst) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(tekst);
            msg.lang = 'nl-NL';
            window.speechSynthesis.speak(msg);
        }

        // Lessen bouwen
        const grid = document.getElementById('lessonGrid');
        for (let i = 1; i <= 30; i++) {
            const schema = (i % 2 === 0) ? "2l-1w-2l" : "1l-1w-1l";
            const card = document.createElement('div');
            card.className = 'lesson-card';
            card.innerHTML = `<strong>Les ${i}</strong><br><button class="start-btn" style="margin-top:10px">START</button>`;
            card.querySelector('button').addEventListener('click', () => runLes(schema));
            grid.appendChild(card);
        }

        async function runLes(schema) {
            if (timerInterval) clearInterval(timerInterval);
            const segs = schema.split('-');
            
            for (let s of segs) {
                let tijd = parseInt(s) * 60;
                let type = s.slice(-1);
                
                document.getElementById('current-mode').innerText = type === 'w' ? "WANDELEN" : "HARDLOPEN";
                audio.src = songs[type];
                audio.loop = true;
                audio.play();
                
                spreekUit(`Begin nu met ${parseInt(s)} minuten ${type === 'w' ? 'wandelen' : 'hardlopen'}`);

                await new Promise(res => {
                    timerInterval = setInterval(() => {
                        let m = Math.floor(tijd / 60), sec = tijd % 60;
                        document.getElementById('timer').innerText = `${m}:${sec < 10 ? '0'+sec : sec}`;
                        if (tijd-- <= 0) { clearInterval(timerInterval); res(); }
                    }, 1000);
                });
            }
            audio.pause();
            spreekUit("Training voltooid!");
        }
    </script>
</body>
</html>
